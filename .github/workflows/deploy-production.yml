name: Deploy Production Stack

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Component to deploy"
        default: "all"
        type: choice
        options: [all, api, user, admin, router]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API Worker & DB
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'deploy_cf:all')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'api' || inputs.target == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Apply D1 migrations
        run: pnpm --filter @foran/api-worker exec wrangler d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: pnpm --filter @foran/api-worker exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
